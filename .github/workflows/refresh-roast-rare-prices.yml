name: Refresh Roast Rare Prices
on:
  schedule:
    # Every 3h, offset off the hour so it does not *start* alongside the cluster
    # (:00) or split (:23) runs. It will still overlap them: both are 6-hourly
    # with a 330-minute timeout, so between them they occupy most of every
    # window. Overlap is expected, and what keeps this worker honest inside it is
    # the worker itself — 15s pacing instead of 10s, at most 30 markets a run
    # (~15 minutes of calls), and abandoning the run after five 429s rather than
    # fighting for the window. Guides are seeded by players pasting them, so the
    # queue is usually short and often empty.
    - cron: '41 */3 * * *'
  workflow_dispatch: {}

concurrency:
  group: roast-rare-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Generous next to the 15-minute run so a long rate-limit backoff can play
    # out, but nowhere near the 5.5h the cluster and split workers take.
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POE_CLIENT_ID: ${{ secrets.POE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No league argument: the worker resolves the current challenge league at
      # run time, so a rollover needs no workflow edit. Rows are seeded by the
      # app when a player pastes a guide — this worker never invents one.
      - name: Refresh Roast rare prices
        run: npm run refresh:roast-rares
