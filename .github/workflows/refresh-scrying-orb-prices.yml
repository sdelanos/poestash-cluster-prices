name: Refresh Scrying Orb Prices
on:
  schedule:
    # Daily at 04:20 UTC — one poe.watch currency call per league, ~100
    # Scrying Orb variants upserted per league.
    - cron: '20 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: scrying-orb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Discovers the priced set from poe.watch (Standard, Hardcore, the live
      # challenge league + its HC variant) and refreshes each. Follows league
      # rollovers with no workflow edit; a league poe.watch hasn't indexed is
      # skipped, and only a genuine poe.watch outage fails the run.
      - name: Refresh Scrying Orb prices (auto)
        run: npx tsx src/refresh-scrying-orb-prices.ts
